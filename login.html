<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <title>Login 08</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

    <link href="login/style.css" rel="stylesheet" />
    <link href="login/loginChangeColor.css" rel="stylesheet" />

    <link href="https://fonts.googleapis.com/css2?family=El+Messiri&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'El Messiri', sans-serif;
        }

        a.a-primary {
            color: #7E57FF; /* نفس لون الـ btn-primary في التمبلت */
            /*text-decoration: none;*/ /* إزالة الخط */
        }

            a.a-primary:hover {
                color: #8608f6; /* يبقى اللون نفسه عند المرور */
            }
    </style>

</head>
<body class="bodycolre">

    <section class="ftco-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center mb-2">
                    <h2 class="heading-section" style="font-family: 'El Messiri', sans-serif;"> تسجيل دخول</h2>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="login-wrap p-4 p-md-5">
                        <div class="icon d-flex align-items-center justify-content-center">
                            <span class="fa fa-user-o"> </span>
                        </div>
                        <form action="#" class="login-form">
                            <div class="form-group">
                                <input type="text" class="form-control rounded-left" placeholder="أسم المستخدم" required>
                            </div>
                            <div class="form-group d-flex">
                                <input type="password" class="form-control rounded-left" placeholder="كلمة المرور" required>
                            </div>
                            <div class="form-group d-flex justify-content-between align-items-center m-1 mt-3" dir="rtl">
                                <label class="checkbox-wrap checkbox-primary d-flex align-items-center m-0">
                                    <input type="checkbox" class="mr-2">
                                    <span class="checkmark"></span>
                                    تذكرني
                                </label>
                                <a href="sign up.html" class="a-primary">ليس لدي حساب</a>
                            </div>

                            <!-- الرابط أسفل الـ div ومحاذاته لليمين -->
                            <a href="#" class="a-primary d-block text-right">نسيت كلمة المرور</a>

                            <!--<div class="form-group">
                                <button type="submit" class="btn btn-primary rounded submit p-3 px-5">دخول</button>
                            </div>-->

                            <div class="form-group" style="position: absolute; bottom: -40px; right:55px; width: 75%;">
                                <div class="row">
                                    <div class="col-6">
                                        <button type="submit" class="btn btn-primary rounded w-100 p-3">دخول</button>
                                    </div>
                                    <div class="col-6">
                                        <a href="index.html" class="btn btn-primary rounded w-100 p-3 text-center">الرئيسية</a>
                                    </div>
                                </div>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/jquery.min.js"></script>
    <script src="js/popper.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
